name: Docker Build & Push to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build Docker image and push to Aliyun ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-ktqzv9pa9ismns06.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            crpi-ktqzv9pa9ismns06.cn-hangzhou.personal.cr.aliyuncs.com/new-api:latest
            crpi-ktqzv9pa9ismns06.cn-hangzhou.personal.cr.aliyuncs.com/new-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
